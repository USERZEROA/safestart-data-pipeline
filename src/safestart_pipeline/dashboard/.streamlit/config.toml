# Streamlit also applies these colors to native controls, tables, chart labels and keyboard focus.
[theme]
base = "dark"
baseRadius = "0.4rem"
paddingTop = "1.25rem"
headingFontSizes = ["2rem", "1.35rem", "1.12rem"]
headingFontWeights = [700, 650, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 650
chartCategoricalColors = ["#348cd1", "#d17329", "#119881", "#ab891b", "#c562ab", "#739533", "#8f76d4"]

[theme.dark]
primaryColor = "#57ddd6"
backgroundColor = "#07121e"
secondaryBackgroundColor = "#102434"
textColor = "#e7f4fa"
linkColor = "#92ede7"
borderColor = "#385569"
dataframeHeaderBackgroundColor = "#152d40"

[theme.light]
primaryColor = "#006c71"
backgroundColor = "#edf5f8"
secondaryBackgroundColor = "#e1edf3"
textColor = "#102c41"
linkColor = "#005d64"
borderColor = "#94aebb"
dataframeHeaderBackgroundColor = "#dceaf1"

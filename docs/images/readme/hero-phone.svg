<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img"
     aria-labelledby="title desc">
  <title id="title">SafeStart data pipeline</title>
  <desc id="desc">From the public mine-safety record to a crew's pre-shift check, in five stages: collect, keep, model,
    stream and serve.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .kicker { fill: #fb923c; font-size: 17px; font-weight: 700; letter-spacing: 2.5px; }
    .tag { fill: #f8fafc; font-size: 40px; font-weight: 700; }
    .hot { fill: #fb923c; }
    .node { fill: #ffffff0f; stroke: #ffffff4d; stroke-width: 2.5; }
    .num { fill: #fdba74; font-size: 24px; font-weight: 700; text-anchor: middle; }
    .label { fill: #f8fafc; font-size: 23px; font-weight: 700; text-anchor: middle; }
    .wire { fill: none; stroke: #fb923c; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 9;
            opacity: .9; }
    .packet { fill: #fdba74; }
    .halo { fill: #f97316; opacity: .45; }
    .wire { animation: flow 1.1s linear infinite; }
    .node { animation: lit 6s ease-in-out infinite; }
    .move { animation: cross 6s ease-in-out infinite backwards; }
    .n2 .node { animation-delay: 1.2s; } .n3 .node { animation-delay: 2.4s; }
    .n4 .node { animation-delay: 3.6s; } .n5 .node { animation-delay: 4.8s; }
    .m1 { animation-delay: .6s; } .m2 { animation-delay: 1.8s; }
    .m3 { animation-delay: 3s; } .m4 { animation-delay: 4.2s; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @keyframes lit { 0%, 30%, 100% { stroke: #ffffff4d; fill: #ffffff0f; } 10% { stroke: #fb923c; fill: #f9731633; } }
    @keyframes cross { 0% { transform: translateX(-28px); opacity: 0; } 3%, 17% { opacity: 1; }
                       20%, 100% { transform: translateX(28px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .wire, .node, .move { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16213b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".78" r=".6">
      <stop offset="0" stop-color="#f97316" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <filter id="soft" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="640" height="400" rx="24" fill="url(#bg)"/>
  <rect width="640" height="400" rx="24" fill="url(#grid)"/>
  <rect width="640" height="400" rx="24" fill="url(#glow)"/>

  <text class="kicker" x="36" y="56">IDS 706 · FINAL PROJECT · HAIWEI YU</text>
  <text class="tag" x="36" y="116">From the public mine-safety</text>
  <text class="tag" x="36" y="164">record to a crew's</text>
  <text class="tag hot" x="36" y="212">pre-shift check</text>

  <!-- five stages at x = 64 + 128 i -->
  <g class="n1"><circle class="node" cx="64" cy="284" r="30"/><text class="num" x="64" y="293">1</text>
    <text class="label" x="64" y="354">Collect</text></g>
  <g class="n2"><circle class="node" cx="192" cy="284" r="30"/><text class="num" x="192" y="293">2</text>
    <text class="label" x="192" y="354">Keep</text></g>
  <g class="n3"><circle class="node" cx="320" cy="284" r="30"/><text class="num" x="320" y="293">3</text>
    <text class="label" x="320" y="354">Model</text></g>
  <g class="n4"><circle class="node" cx="448" cy="284" r="30"/><text class="num" x="448" y="293">4</text>
    <text class="label" x="448" y="354">Stream</text></g>
  <g class="n5"><circle class="node" cx="576" cy="284" r="30"/><text class="num" x="576" y="293">5</text>
    <text class="label" x="576" y="354">Serve</text></g>

  <line class="wire" x1="98" y1="284" x2="158" y2="284"/>
  <line class="wire" x1="226" y1="284" x2="286" y2="284"/>
  <line class="wire" x1="354" y1="284" x2="414" y2="284"/>
  <line class="wire" x1="482" y1="284" x2="542" y2="284"/>
  <g transform="translate(128 284)"><g class="move m1"><circle class="halo" r="10" filter="url(#soft)"/>
    <circle class="packet" r="5"/></g></g>
  <g transform="translate(256 284)"><g class="move m2"><circle class="halo" r="10" filter="url(#soft)"/>
    <circle class="packet" r="5"/></g></g>
  <g transform="translate(384 284)"><g class="move m3"><circle class="halo" r="10" filter="url(#soft)"/>
    <circle class="packet" r="5"/></g></g>
  <g transform="translate(512 284)"><g class="move m4"><circle class="halo" r="10" filter="url(#soft)"/>
    <circle class="packet" r="5"/></g></g>
</svg>

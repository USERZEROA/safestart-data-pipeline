<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 528" width="1200" height="528"
     role="img" aria-labelledby="title">
  <title id="title">Key numbers: 6 public sources (websites, eCFR, 20 datasets, an API); 84,602 files kept (44.6
    GB raw archive, every version); 18.1 M lake rows (20 datasets, 40 versions in Parquet); 3.1
    M violations (1.2 M inspections, 276,013 accidents); 10 SQL questions (over 8 tables and 5
    marts in DuckDB); 374,400 events streamed (through Kafka into PostgreSQL); 0.909 test ROC
    AUC (riskiest 5% at 10x the base rate); 556 tests (then the whole stack in CI); 5 dashboard
    pages (live on Google Cloud over HTTPS)</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .tile { fill: #ffffff0b; stroke: #ffffff1f; stroke-width: 1.5; }
    .num { font-size: 46px; font-weight: 700; }
    .label { fill: #f1f5f9; font-size: 20px; font-weight: 600; }
    .detail { fill: #94a3b8; font-size: 16px; }
    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-600px); } 45%, 100% { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16213b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="528" rx="24"/></clipPath>
  </defs>
  <rect width="1200" height="528" rx="24" fill="url(#bg)"/>
  <g><rect class="tile" x="36" y="36" width="360" height="136" rx="16"/>
    <rect x="36" y="54" width="4" height="100" rx="2" fill="#cbd5e1"/>
    <text class="num" x="58" y="98" fill="#cbd5e1">6</text>
    <text class="label" x="58" y="126">public sources</text>
    <text class="detail" x="58" y="150">websites, eCFR, 20 datasets, an API</text></g>
  <g><rect class="tile" x="420" y="36" width="360" height="136" rx="16"/>
    <rect x="420" y="54" width="4" height="100" rx="2" fill="#60a5fa"/>
    <text class="num" x="442" y="98" fill="#60a5fa">84,602</text>
    <text class="label" x="442" y="126">files kept</text>
    <text class="detail" x="442" y="150">44.6 GB raw archive, every version</text></g>
  <g><rect class="tile" x="804" y="36" width="360" height="136" rx="16"/>
    <rect x="804" y="54" width="4" height="100" rx="2" fill="#60a5fa"/>
    <text class="num" x="826" y="98" fill="#60a5fa">18.1 M</text>
    <text class="label" x="826" y="126">lake rows</text>
    <text class="detail" x="826" y="150">20 datasets, 40 versions in Parquet</text></g>
  <g><rect class="tile" x="36" y="196" width="360" height="136" rx="16"/>
    <rect x="36" y="214" width="4" height="100" rx="2" fill="#60a5fa"/>
    <text class="num" x="58" y="258" fill="#60a5fa">3.1 M</text>
    <text class="label" x="58" y="286">violations</text>
    <text class="detail" x="58" y="310">1.2 M inspections, 276,013 accidents</text></g>
  <g><rect class="tile" x="420" y="196" width="360" height="136" rx="16"/>
    <rect x="420" y="214" width="4" height="100" rx="2" fill="#60a5fa"/>
    <text class="num" x="442" y="258" fill="#60a5fa">10</text>
    <text class="label" x="442" y="286">SQL questions</text>
    <text class="detail" x="442" y="310">over 8 tables and 5 marts in DuckDB</text></g>
  <g><rect class="tile" x="804" y="196" width="360" height="136" rx="16"/>
    <rect x="804" y="214" width="4" height="100" rx="2" fill="#fb923c"/>
    <text class="num" x="826" y="258" fill="#fb923c">374,400</text>
    <text class="label" x="826" y="286">events streamed</text>
    <text class="detail" x="826" y="310">through Kafka into PostgreSQL</text></g>
  <g><rect class="tile" x="36" y="356" width="360" height="136" rx="16"/>
    <rect x="36" y="374" width="4" height="100" rx="2" fill="#60a5fa"/>
    <text class="num" x="58" y="418" fill="#60a5fa">0.909</text>
    <text class="label" x="58" y="446">test ROC AUC</text>
    <text class="detail" x="58" y="470">riskiest 5% at 10x the base rate</text></g>
  <g><rect class="tile" x="420" y="356" width="360" height="136" rx="16"/>
    <rect x="420" y="374" width="4" height="100" rx="2" fill="#2dd4bf"/>
    <text class="num" x="442" y="418" fill="#2dd4bf">556</text>
    <text class="label" x="442" y="446">tests</text>
    <text class="detail" x="442" y="470">then the whole stack in CI</text></g>
  <g><rect class="tile" x="804" y="356" width="360" height="136" rx="16"/>
    <rect x="804" y="374" width="4" height="100" rx="2" fill="#4ade80"/>
    <text class="num" x="826" y="418" fill="#4ade80">5</text>
    <text class="label" x="826" y="446">dashboard pages</text>
    <text class="detail" x="826" y="470">live on Google Cloud over HTTPS</text></g>

  <g clip-path="url(#card)"><rect class="sweep" x="0" y="-40" width="400" height="608"
    fill="url(#shine)" transform="translate(-600 0)"/></g>
</svg>

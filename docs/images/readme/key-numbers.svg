<title id="title">SafeStart build record</title>
<desc id="desc">November 23, 2026 build. 6 public sources (Websites, eCFR, datasets and API); 84,602 files kept (44.6 GB across archived versions); 18.1 M lake rows (20 datasets / 40 Parquet versions); 3.1 M violations (1.2 M inspections / 276,013 accidents); 10 sql questions (8 model tables / 5 DuckDB marts); 374,400 events streamed (Kafka into PostgreSQL); 0.909 test roc auc (Top 5% at 10× the base rate); 556 tests (Unit and integration suite); 5 dashboard pages (Google Cloud / HTTPS).</desc>

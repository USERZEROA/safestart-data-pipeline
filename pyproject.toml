[project]
name = "safestart-data-pipeline"
version = "0.1.0"
description = "Data pipeline for U.S. mine and workplace safety sources (MSHA, OSHA, eCFR) behind the SafeStart application"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Haiwei Yu" }]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "lxml>=5.3",
  "protego>=0.3",
]

[project.scripts]
ssp = "safestart_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safestart_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project]
name = "safestart-data-pipeline"
version = "0.1.0"
description = "Data pipeline for U.S. mine and workplace safety sources (MSHA, OSHA, eCFR) behind the SafeStart application"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Haiwei Yu" }]
requires-python = ">=3.12"
# The crawler needs only these; it runs from its own small environment (scripts/start-crawl.ps1) so that heavier
# analysis and orchestration packages can change while a multi-day crawl keeps going.
dependencies = [
  "httpx>=0.28",
  "lxml>=5.3",
  "protego>=0.3",
]

[project.optional-dependencies]
orchestration = ["prefect>=3.4"]
analysis = [
    "duckdb>=1.1",
    "polars>=1.20",
]
# Kafka and PostgreSQL clients for the streaming layer (producers, consumers, watchers).
stream = [
    "confluent-kafka>=2.16",
    "psycopg[binary]>=3.3",
]
dashboard = [
    "streamlit>=1.67",
    "altair>=5.5",
    "pandas>=2.3",
]
ml = ["scikit-learn>=1.5", "joblib>=1.4"]

[project.scripts]
ssp = "safestart_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safestart_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
